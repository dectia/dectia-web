                        target.focus({ preventScroll: true });

                focusHashTarget();
                window.addEventListener('hashchange', focusHashTarget);

            const t = useT();
            const messages = t.telemetry.messages;
            const [textIndex, setTextIndex] = useState(0);
            const [charIndex, setCharIndex] = useState(0);

            useEffect(() => {
                const typeInterval = setInterval(() => {
                    if (charIndex < messages[textIndex].length) {
                        setCharIndex(prev => prev + 1);
                    } else {
                        clearInterval(typeInterval);
                        setTimeout(() => {
                            setCharIndex(0);
                            setTextIndex((prev) => (prev + 1) % messages.length);
                        }, 2000);
                    }
                }, 50);
                return () => clearInterval(typeInterval);
            }, [textIndex, charIndex]);

            return (
                <div className="bg-ink rounded-3xl p-8 h-96 border border-chalk/10 relative flex flex-col font-mono">

            const [uploaded, setUploaded] = useState(false);

            useEffect(() => {
                if(!containerRef.current) return;
                
                let ctx = gsap.context(() => {
                    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1 });
                    
                    tl.set(cursorRef.current, { x: 50, y: 150, scale: 1 });
                    tl.set(fileRef.current, { x: 30, y: 180, scale: 1, boxShadow: "none" });
                    tl.set(dropzoneRef.current, { borderColor: "rgba(232, 232, 227, 0.2)", backgroundColor: "transparent" });
                    tl.call(() => setUploaded(false));

                    tl.to(cursorRef.current, { x: 80, y: 195, duration: 1, ease: "power2.inOut" });
                    tl.to(cursorRef.current, { scale: 0.9, duration: 0.2 });
                    tl.to(fileRef.current, { scale: 1.05, boxShadow: "0 20px 25px -5px rgba(0, 0, 0, 0.5)", duration: 0.2 }, "<");

                        x: "+=120", y: "-=80", 
                        duration: 1.5, 
                        ease: "power2.inOut",
                        onStart: () => {
                            gsap.to(dropzoneRef.current, { backgroundColor: "rgba(255, 255, 255, 0.03)", duration: 0.5 });
                        }
                    });

                    tl.to(cursorRef.current, { scale: 1, duration: 0.2 });
                    tl.to(fileRef.current, { scale: 1, boxShadow: "none", duration: 0.2 }, "<");
                    tl.call(() => setUploaded(true));
                    tl.to(dropzoneRef.current, { borderColor: "#00E68A", backgroundColor: "rgba(0, 230, 138, 0.05)", duration: 0.3 });
                    
                    tl.to(cursorRef.current, { x: 250, y: 50, duration: 1, ease: "power2.inOut" });

                <div ref={dashRef} className="col-span-1 md:col-span-2 bg-obsidian border border-chalk/10 rounded-3xl md:h-96 flex overflow-hidden flex-col md:flex-row">
                    <div className="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center border-b md:border-b-0 md:border-r border-chalk/10 z-10 bg-gradient-to-r from-obsidian to-transparent">
                        <h3 className="font-sora font-bold text-3xl md:text-4xl mb-4 leading-tight">{t.dashboard.title}<br/><span className="text-sgreen font-cormorant italic">{t.dashboard.titleItalic}</span></h3>
                        <p className="font-outfit text-chalk/60 text-sm md:text-base">{t.dashboard.description}</p>
                    </div>
                    <div className="w-full md:w-1/2 relative bg-navy/20 overflow-hidden pt-8 md:pt-12 px-6 md:px-8 h-64 md:h-auto mask-image-bottom">
                        <div className="dash-content w-full absolute top-12 left-0 px-8 flex flex-col gap-6">
                            
                            <div className="bg-ink p-6 rounded-2xl border border-chalk/5">
                                <h4 className="text-xs font-mono text-chalk/40 mb-4">{t.dashboard.riskIndex}</h4>
                                <div className="relative w-40 h-20 mx-auto overflow-hidden">
                                     <div className="absolute w-40 h-40 border-[16px] border-chalk/10 rounded-full"></div>
                                     <div className="gauge-fill absolute w-40 h-40 border-[16px] border-transparent border-t-sgreen border-r-sgreen rounded-full origin-center"></div>
                                </div>
                                <div className="text-center mt-[-10px] font-sora font-bold text-2xl">82<span className="text-xs text-sgreen ml-1">{t.dashboard.stable}</span></div>
                            </div>

                            <div className="bg-ink p-6 rounded-2xl border border-chalk/5 mb-20">
                                <h4 className="text-xs font-mono text-chalk/40 mb-6">{t.dashboard.findings}</h4>
                                <div className="flex justify-between items-end h-32 px-4">
                                    {[60, 80, 40, 90, 50, 70].map((h, i) => (
                                        <div key={i} className="w-6 bg-chalk/10 rounded-t-sm relative h-full flex items-end">
                                            <div className="bar-fill w-full bg-sgreen rounded-t-sm" style={{ height: `${h}%` }}></div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };
        
        const renderStepContent = (step) => {
            if (!step.bold1) return step.content;
            const parts1 = step.content.split(step.bold1);
            if (parts1.length < 2) return step.content;
            if (!step.bold2) return <>{parts1[0]}<strong>{step.bold1}</strong>{parts1[1]}</>;
            const parts2 = parts1[1].split(step.bold2);
            if (parts2.length < 2) return <>{parts1[0]}<strong>{step.bold1}</strong>{parts1[1]}</>;
            return <>{parts1[0]}<strong>{step.bold1}</strong>{parts2[0]}<strong>{step.bold2}</strong>{parts2[1]}</>;
        };

        const Process = () => {
            const t = useT();
            const processRef = useRef(null);
            
            useLayoutEffect(() => {
                let ctx = gsap.context(() => {
                    gsap.to(".process-bg", {
                        yPercent: 30,
                        ease: "none",
                        scrollTrigger: {
                            trigger: processRef.current,
                            start: "top bottom",
                            end: "bottom top",
                            scrub: true
                        }
                    });
                }, processRef);
                return () => ctx.revert();
            }, []);

            return (
                <section id="paso" tabIndex={-1} ref={processRef} aria-labelledby="paso-heading" className="section-anchor relative py-16 md:py-32 px-6 md:px-24 overflow-hidden bg-bone text-ink outline-none">
                    <div className="absolute inset-0 z-0 overflow-hidden">
                        <img 
                            src="https://images.unsplash.com/39/lIZrwvbeRuuzqOoWJUEn_Photoaday_CSD.jpg" 
                            alt="" 
                            aria-hidden="true"
                            loading="lazy"
                            decoding="async"
                            className="process-bg w-full h-[150%] object-cover opacity-20 contrast-150 grayscale"
                            onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d'; }}
                        />
                    </div>
                    <div className="relative z-10 max-w-7xl mx-auto">
                        <h2 id="paso-heading" className="font-sora text-3xl md:text-5xl font-bold mb-10 md:mb-16 text-center">{t.process.title} <span className="text-sgreen font-cormorant italic font-normal">{t.process.titleItalic}</span></h2>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            {t.process.steps.map((step, i) => (
                                <div key={i} className="bg-white/80 backdrop-blur-sm border border-navy/10 p-6 md:p-8 rounded-3xl shadow-sm hover:shadow-md transition-shadow">
                                    <h3 className="font-sora font-bold text-xl mb-4 text-navy"><span className="text-sgreen">{i+1}.</span> {step.title}</h3>
                                    <p className="font-outfit text-ink/70 text-sm leading-relaxed font-light">{renderStepContent(step)}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Coverage = () => {
            const t = useT();
            const containerRef = useRef(null);
            const trackRef = useRef(null);
            const cardsAreaRef = useRef(null);
            const progressRef = useRef(null);

            useLayoutEffect(() => {
                let ctx = gsap.context(() => {
                    const track = trackRef.current;
                    const cardsArea = cardsAreaRef.current;

                    gsap.to(track, {
                        x: () => -(track.scrollWidth - cardsArea.clientWidth),
                        ease: "none",
                        scrollTrigger: {
                            trigger: containerRef.current,
                            start: "top top",
                            end: () => `+=${track.scrollWidth - cardsArea.clientWidth}`,
                            scrub: 1,
                            pin: true,
                            anticipatePin: 1,
                            invalidateOnRefresh: true,
                            onUpdate: (self) => {
                                if (progressRef.current) {
                                    progressRef.current.style.transform = `scaleX(${self.progress})`;
                                }
                            }
                        }
                    });
                }, containerRef);
                return () => ctx.revert();
            }, []);

            const caseIcons = [<GearArtifact />, <BuildingArtifact />, <EduArtifact />, <IndustrialArtifact />, <RetailArtifact />, <MoneyArtifact />];
            const cases = t.coverage.cases.map((c, i) => ({ ...c, icon: caseIcons[i] }));

            return (
                <section id="cobertura" tabIndex={-1} ref={containerRef} aria-labelledby="cobertura-heading" className="section-anchor bg-obsidian h-screen flex flex-col overflow-hidden pt-20 pb-8 outline-none">
                    {/* Título arriba */}
                    <div className="flex-shrink-0 mb-6 max-w-7xl w-full mx-auto px-6 md:px-16">
                        <h2 id="cobertura-heading" className="font-sora text-4xl md:text-5xl lg:text-6xl font-bold text-bone leading-tight">
                            {t.coverage.title} <span className="font-cormorant italic text-sgreen font-normal">{t.coverage.titleItalic}</span>
                        </h2>
                        {/* Progress bar */}
                        <div className="mt-5 h-px w-full bg-chalk/10 rounded-full overflow-hidden">
                            <div
                                ref={progressRef}
                                className="h-full bg-sgreen rounded-full origin-left"
                                style={{ transform: 'scaleX(0)' }}
                            ></div>
                        </div>
                    </div>

                    {/* Área de scroll de cards */}
                    <div ref={cardsAreaRef} className="flex-1 overflow-hidden relative"
                        style={{ maskImage: 'linear-gradient(to right, black 80%, transparent 100%)', WebkitMaskImage: 'linear-gradient(to right, black 80%, transparent 100%)' }}
                    >
                        <div ref={trackRef} className="flex h-full items-center gap-6 md:gap-8 pl-6 md:pl-16 pr-10 md:pr-24" style={{ width: 'max-content' }}>
                            {cases.map((c, i) => (
                                <div 
                                    key={i}
                                    className="flex-shrink-0 w-[82vw] sm:w-[340px] md:w-[400px] bg-navy/40 border border-chalk/10 rounded-3xl md:rounded-[3rem] p-6 md:p-10 h-full flex flex-col items-center justify-center backdrop-blur-xl shadow-2xl"
                                >
                                    <div className="mb-6 md:mb-8">
                                        {c.icon}
                                    </div>
                                    <h3 className="font-sora font-bold text-2xl md:text-3xl text-bone text-center mb-4 md:mb-6">{c.title}</h3>
                                    <div className="flex flex-wrap justify-center gap-2 max-w-xs">
                                        {c.tags?.map((tag, idx) => (
                                            <span key={idx} className="bg-obsidian/60 border border-sgreen/30 text-sgreen/90 text-[10px] px-4 py-1.5 rounded-full font-mono shadow-sm">
                                                {tag}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => {
            const t = useT();
            const { lang } = useContext(LangContext);
            const [isFormOpen, setIsFormOpen] = useState(false);
            const formPanelId = "calendly-panel";
            const demoHeadingId = "demo-heading";
            const calendlyUrl = `https://calendly.com/montillajafet/reunion-valorant?background_color=ffffff00&text_color=e8e8e3&primary_color=00e68a&hide_gdpr_banner=1&locale=${lang}`;

            useEffect(() => {
                const script = document.createElement('script');
                script.src = 'https://assets.calendly.com/assets/external/widget.js';
                script.async = true;
                document.body.appendChild(script);
            }, []);

            useEffect(() => {
                const handleEscape = (event) => {
                    if (event.key === 'Escape' && isFormOpen) setIsFormOpen(false);
                };
                document.addEventListener('keydown', handleEscape);
                return () => document.removeEventListener('keydown', handleEscape);
            }, [isFormOpen]);

            return (
                <footer id="agenda-demo" tabIndex={-1} className="section-anchor bg-obsidian pt-10 md:pt-16 px-6 md:px-24 border-t border-navy/30 outline-none">
                    <section
                        className="max-w-7xl mx-auto bg-navy/20 rounded-t-3xl md:rounded-t-[4rem] p-8 md:p-16 border border-b-0 border-chalk/5 mb-0 mt-6 md:mt-8 text-center"
                        aria-labelledby={demoHeadingId}
                    >
                        <h2 id={demoHeadingId} className="font-sora font-bold text-4xl sm:text-5xl md:text-7xl mb-8 md:mb-12 leading-tight">{t.footer.demoTitle} <span className="font-cormorant italic font-normal">{t.footer.demoTitleItalic}</span></h2>
                        <button
                            type="button"
                            className="btn-magnetic bg-bone text-ink font-bold px-8 md:px-12 py-4 md:py-5 rounded-full text-base md:text-lg shadow-xl inline-flex items-center gap-3"
                            aria-expanded={isFormOpen}
                            aria-controls={formPanelId}
                            onClick={() => setIsFormOpen((open) => !open)}
                        >
                            {isFormOpen ? t.footer.closeForm : t.footer.openForm}
                            <span aria-hidden="true" className={"w-2 h-2 rounded-full bg-sgreen " + (isFormOpen ? "" : "animate-pulse")}></span>
                        </button>
                        
                        <div 
                            id={formPanelId}
                            role="region"
                            aria-labelledby={demoHeadingId}
                            aria-hidden={!isFormOpen}
                            tabIndex={isFormOpen ? undefined : -1}
                            className={"calendly-panel overflow-hidden transition-all duration-700 ease-in-out" + (isFormOpen ? "" : " pointer-events-none")}
                            style={{ 
                                maxHeight: isFormOpen ? '900px' : '0px', 
                                opacity: isFormOpen ? 1 : 0,
                                marginTop: isFormOpen ? '3rem' : '0px'
                            }}
                        >
                            <div className="calendly-wrapper rounded-3xl overflow-hidden w-full mx-auto">
                                <div 
                                    className="calendly-inline-widget" 
                                    data-url={calendlyUrl}
                                    title={t.footer.calendlyTitle}
                                    style={{ 
                                        minWidth: '320px',
                                        width: '100%',
                                        marginTop: '-5px'
                                    }}
                                ></div>
                            </div>
                        </div>
                    </section>
                    <div className="max-w-7xl mx-auto py-6 flex flex-col sm:flex-row items-center justify-between gap-3 border-t border-navy/20 mt-0">
                        <div className="flex flex-col items-start gap-2">
                            <span className="font-sora font-bold text-chalk/60 text-sm tracking-tight">Dectia.</span>
                            <span className="font-mono text-xs text-chalk/20 flex items-center gap-1.5">
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" className="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 22V12h6v10"/><path d="M3 9h18"/><path d="M9 3v6"/><path d="M15 3v6"/></svg>
                                {t.footer.address}
                            </span>
                            </div>
                        <span className="font-mono text-xs text-chalk/30">&copy; {new Date().getFullYear()} Dectia. {t.footer.rights}</span>
                    </div>
                </footer>
            );
        };

        const GearArtifact = () => (
            <div className="w-32 h-32 relative flex items-center justify-center border-4 border-dashed border-sgreen/30 rounded-full animate-[spin_10s_linear_infinite]">
                <div className="w-16 h-16 bg-sgreen/20 rounded-full flex items-center justify-center border border-sgreen">
                    <div className="w-6 h-6 bg-sgreen rounded-full animate-pulse"></div>
                </div>
            </div>
        );
        
        const BuildingArtifact = () => (
            <div className="w-32 h-32 relative overflow-hidden border border-chalk/20 bg-ink rounded-lg flex items-end justify-center p-4">
                <div className="w-full h-2 bg-sgreen/50 absolute top-0 animate-[ping_3s_infinite]"></div>
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#00E68A" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            </div>
        );

        const EduArtifact = () => (
            <div className="w-40 h-16 flex items-center justify-between border-b-2 border-chalk/20 relative mt-8">
                <div className="h-4 w-4 rounded-full bg-sgreen shadow-[0_0_15px_#00E68A] absolute left-0 animate-ping"></div>
                <div className="h-4 w-4 rounded-full bg-sgreen shadow-[0_0_15px_#00E68A] absolute left-1/2 -translate-x-1/2 animate-ping delay-100"></div>
                <div className="h-4 w-4 rounded-full bg-sgreen shadow-[0_0_15px_#00E68A] absolute right-0 animate-ping delay-200"></div>
            </div>
        );

        const IndustrialArtifact = () => (
            <div className="w-32 h-32 grid grid-cols-3 gap-2 p-2 border border-chalk/20 bg-ink rounded-xl">
                {[...Array(9)].map((_, i) => (
                    <div key={i} className="bg-sgreen/20 rounded-sm relative overflow-hidden">
                        <div className="absolute inset-0 bg-sgreen opacity-0" style={{ animation: `ping 2s infinite ${i * 0.2}s` }}></div>
                    </div>
                ))}
            </div>
        );
        
        const RetailArtifact = () => (
            <div className="w-48 h-20 rounded-full border border-chalk/20 relative flex items-center px-4 overflow-hidden">
                <div className="absolute h-full w-4 bg-sgreen left-0 blur-md" style={{ animation: 'slideRight 3s infinite linear' }}></div>
                <style>{`
                    @keyframes slideRight {
                        0% { left: 0%; opacity: 0;}
                        10% { opacity: 1;}
                        90% { opacity: 1;}
                        100% { left: 100%; opacity: 0; }
                    }
                `}</style>
                <div className="w-full flex justify-between font-mono text-xs text-chalk/40 z-10">
                    <span>IN</span>
                    <span>OUT</span>
                </div>
            </div>
        );

        const MoneyArtifact = () => (
            <div className="w-32 h-32 border border-chalk/20 rounded-2xl flex items-center justify-center p-4">
                <svg className="w-16 h-16 text-sgreen animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
