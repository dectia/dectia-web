<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dectia - Análisis de Riesgo AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=JetBrains+Mono:wght@100..800&family=Outfit:wght@100..900&family=Sora:wght@100..800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0B1D3A',
                        sgreen: '#00E68A',
                        obsidian: '#0A0E14',
                        chalk: '#E8E8E3',
                        bone: '#F5F5F0',
                        ink: '#12161D'
                    },
                    fontFamily: {
                        sora: ['Sora', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                        cormorant: ['Cormorant Garamond', 'serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    },
                    borderRadius: {
                        '2xl': '2rem',
                        '3xl': '3rem',
                        '4xl': '4rem'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0A0E14;
            color: #E8E8E3;
            overflow-x: hidden;
            font-family: 'Outfit', sans-serif;
        }
        
        /* body::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.05;
            background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        } */

        .btn-magnetic {
            position: relative;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-magnetic:hover {
            transform: scale(1.05);
        }
        .btn-magnetic::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        .btn-magnetic:hover::before {
            left: 100%;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #0A0E14; }
        ::-webkit-scrollbar-thumb { background: #0B1D3A; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #00E68A; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .mask-image-bottom {
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }
        /* Hide scrollbars for Calendly iframe */
        .calendly-inline-widget iframe {
            scrollbar-width: none !important;
        }
        .calendly-inline-widget iframe::-webkit-scrollbar {
            display: none !important;
        }
    </style>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useLayoutEffect } = React;
        gsap.registerPlugin(ScrollTrigger);

        const IconCheck = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"></polyline></svg>
        );
        const IconUpload = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        );
        const IconFileText = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        );
        const IconUser = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        );
        const IconLaptop = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="2" y1="20" x2="22" y2="20"></line></svg>
        );

        const App = () => {
            return (
                <div className="bg-obsidian w-full min-h-screen relative font-outfit text-chalk">
                    <Navbar />
                    <Hero />
                    <Features />
                    <Process />
                    <Coverage />
                    <Footer />
                </div>
            );
        };

        const Navbar = () => {
            const navRef = useRef(null);
            const containerRef = useRef(null);

            useLayoutEffect(() => {
                let ctx = gsap.context(() => {
                    ScrollTrigger.create({
                        start: 'top -50',
                        end: 99999,
                        toggleClass: {
                            targets: containerRef.current,
                            className: 'nav-scrolled'
                        }
                    });
                });
                return () => ctx.revert();
            }, []);

            return (
                <nav className="fixed top-6 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-5xl transition-all duration-500 group" ref={containerRef}>
                    <div ref={navRef} className="flex items-center justify-between px-8 py-4 rounded-full border border-transparent transition-all duration-500 bg-transparent text-white group-[.nav-scrolled]:bg-bone/80 group-[.nav-scrolled]:backdrop-blur-md group-[.nav-scrolled]:border-sgreen/30 group-[.nav-scrolled]:text-ink shadow-lg">
                        <div className="font-sora font-bold tracking-tight text-xl">Dectia.</div>
                        <div className="hidden md:flex gap-8 text-sm font-medium">
                            <a href="#features" className="hover:text-sgreen transition-colors">Plataforma</a>
                            <a href="#paso" className="hover:text-sgreen transition-colors">Metodología</a>
                            <a href="#cobertura" className="hover:text-sgreen transition-colors">Casos de Uso</a>
                        </div>
                        <div className="flex items-center gap-6">
                            <a href="#agenda-demo" className="btn-magnetic bg-sgreen text-navy font-bold px-6 py-2 rounded-full text-sm flex items-center justify-center">
                                Agendar Demo
                            </a>
                            <a href="https://app.dectia-ai.com" target="_blank" rel="noopener noreferrer" className="btn-magnetic bg-white text-navy font-bold px-6 py-2 rounded-full text-sm hover:opacity-90 transition-opacity">Acceder</a>
                        </div>
                    </div>
                </nav>
            );
        };

        const Hero = () => {
            const heroRef = useRef(null);
            
            useLayoutEffect(() => {
                let ctx = gsap.context(() => {
                    gsap.from(".hero-text", {
                        y: 50,
                        opacity: 0,
                        duration: 1.2,
                        stagger: 0.2,
                        ease: "power4.out",
                        delay: 0.2
                    });
                }, heroRef);
                return () => ctx.revert();
            }, []);

            return (
                <section ref={heroRef} className="relative w-full h-[100dvh] flex items-end pb-24 px-8 md:px-24">
                    <div className="absolute inset-0 z-0">
                        <img 
                            src="./hero-bg.png" 
                            alt="Security Dashboard" 
                            className="w-full h-full object-cover grayscale-[30%]"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-obsidian via-obsidian/80 to-navy/30 mix-blend-multiply"></div>
                        <div className="absolute inset-0 bg-gradient-to-br from-obsidian via-transparent to-transparent"></div>
                    </div>
                    
                    <div className="relative z-10 max-w-4xl left-0 text-left">
                        <p className="hero-text text-sgreen font-mono text-sm tracking-widest mb-6 uppercase">
                            [ INTELIGENCIA DE SEGURIDAD FÍSICA ]
                        </p>
                        <h1 className="hero-text font-sora font-bold text-6xl md:text-8xl leading-[0.9] tracking-tighter text-bone mb-4">
                            De semanas
                        </h1>
                        <h1 className="hero-text font-cormorant italic text-6xl md:text-8xl leading-[0.9] text-bone mb-10">
                            a horas.
                        </h1>
                        <p className="hero-text font-outfit text-xl md:text-2xl text-chalk/80 max-w-2xl font-light mb-12">
                            Convierte auditorías y relevamientos de seguridad en procesos rápidos, trazables y asistidos por IA. Del campo al informe en el mismo día.
                        </p>
                        <div className="hero-text flex gap-4">
                            <button className="btn-magnetic bg-bone text-ink font-bold px-8 py-4 rounded-full flex items-center gap-2">
                                Iniciar Evaluación
                                <div className="w-2 h-2 rounded-full bg-sgreen animate-pulse"></div>
                            </button>
                        </div>
                    </div>
                </section>
            );
        };

        const Features = () => {
            return (
                <section id="features" className="py-32 px-8 md:px-24 bg-obsidian">
                    <div className="max-w-7xl mx-auto">
                        <h2 className="font-sora text-5xl font-bold mb-4">Precisión y <span className="font-cormorant italic text-sgreen font-normal">expertise.</span></h2>
                        <p className="font-outfit text-xl text-chalk/60 mb-20 max-w-2xl">Instrumentos funcionales diseñados para auditar el riesgo en tiempo récord con seguridad end-to-end.</p>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <DashboardCard />
                            <ComplianceCard />
                            <TelemetryCard />
                            <UploaderCard />
                            <HeadcountCard />
                        </div>
                    </div>
                </section>
            );
        };

        const ComplianceCard = () => {
            const [cards, setCards] = useState(["Normativa Interna", "ISO 27001", "NFPA 730"]);
            
            useEffect(() => {
                const interval = setInterval(() => {
                    setCards(prev => {
                        const newCards = [...prev];
                        const last = newCards.pop();
                        newCards.unshift(last);
                        return newCards;
                    });
                }, 3000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="bg-navy/30 border border-chalk/10 rounded-3xl p-10 h-96 flex flex-col items-center justify-center relative overflow-hidden">
                    <h3 className="absolute top-8 left-8 font-sora font-bold text-xl">Estándares siempre vigentes</h3>
                    <div className="relative w-full max-w-xs h-48 mt-12">
                        {cards.map((text, i) => (
                            <div 
                                key={text}
                                className="absolute w-full bg-bone text-ink p-6 rounded-2xl shadow-xl border border-chalk flex justify-between items-center transition-all duration-700"
                                style={{
                                    top: `${i * 15}px`,
                                    transform: `scale(${1 - i * 0.05}) translateY(${i === 0 ? 0 : 10}px)`,
                                    opacity: 1 - (i * 0.2),
                                    zIndex: 10 - i,
                                    transitionTimingFunction: "cubic-bezier(0.34, 1.56, 0.64, 1)"
                                }}
                            >
                                <span className="font-sora font-bold font-sm">{text}</span>
                                <IconCheck className="text-sgreen" size={20} />
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const TelemetryCard = () => {
            const messages = [
                "Inicializando modelo local...",
                "Analizando contra ISO 27001 > Check.",
                "Contrastando respuestas vs ASIS Standard...",
                "Score crítico: 82/100 (Estable)",
                "Generando matriz de riesgos..."
            ];
            const [textIndex, setTextIndex] = useState(0);
            const [charIndex, setCharIndex] = useState(0);

            useEffect(() => {
                const typeInterval = setInterval(() => {
                    if (charIndex < messages[textIndex].length) {
                        setCharIndex(prev => prev + 1);
                    } else {
                        clearInterval(typeInterval);
                        setTimeout(() => {
                            setCharIndex(0);
                            setTextIndex((prev) => (prev + 1) % messages.length);
                        }, 2000);
                    }
                }, 50);
                return () => clearInterval(typeInterval);
            }, [textIndex, charIndex]);

            return (
                <div className="bg-ink rounded-3xl p-8 h-96 border border-chalk/10 relative flex flex-col font-mono">
                    <div className="flex justify-between items-center mb-8 border-b border-chalk/10 pb-4">
                        <h3 className="font-sora font-bold text-xl text-bone">Potenciado con IA</h3>
                        <div className="flex items-center gap-2 text-xs text-sgreen bg-sgreen/10 px-3 py-1 rounded-full">
                            <div className="w-1.5 h-1.5 rounded-full bg-sgreen animate-pulse"></div>
                            Análisis en vivo
                        </div>
                    </div>
                    <div className="flex-1 flex flex-col justify-end text-sm text-sgreen/90">
                        {messages.slice(0, textIndex).map((m, i) => (
                            <div key={i} className="mb-2 opacity-50">{`> ${m}`}</div>
                        ))}
                        <div className="mb-2">
                            {`> ${messages[textIndex].substring(0, charIndex)}`}
                            <span className="inline-block w-2 h-4 bg-sgreen ml-1 animate-pulse"></span>
                        </div>
                    </div>
                </div>
            );
        };

        const UploaderCard = () => {
            const containerRef = useRef(null);
            const cursorRef = useRef(null);
            const fileRef = useRef(null);
            const dropzoneRef = useRef(null);
            const [uploaded, setUploaded] = useState(false);

            useEffect(() => {
                if(!containerRef.current) return;
                
                let ctx = gsap.context(() => {
                    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1 });
                    
                    tl.set(cursorRef.current, { x: 50, y: 150, scale: 1 });
                    tl.set(fileRef.current, { x: 30, y: 180, scale: 1, boxShadow: "none" });
                    tl.set(dropzoneRef.current, { borderColor: "rgba(232, 232, 227, 0.2)", backgroundColor: "transparent" });
                    tl.call(() => setUploaded(false));

                    tl.to(cursorRef.current, { x: 80, y: 195, duration: 1, ease: "power2.inOut" });
                    tl.to(cursorRef.current, { scale: 0.9, duration: 0.2 });
                    tl.to(fileRef.current, { scale: 1.05, boxShadow: "0 20px 25px -5px rgba(0, 0, 0, 0.5)", duration: 0.2 }, "<");
                    
                    tl.to([cursorRef.current, fileRef.current], { 
                        x: "+=120", y: "-=80", 
                        duration: 1.5, 
                        ease: "power2.inOut",
                        onStart: () => {
                            gsap.to(dropzoneRef.current, { backgroundColor: "rgba(255, 255, 255, 0.03)", duration: 0.5 });
                        }
                    });

                    tl.to(cursorRef.current, { scale: 1, duration: 0.2 });
                    tl.to(fileRef.current, { scale: 1, boxShadow: "none", duration: 0.2 }, "<");
                    tl.call(() => setUploaded(true));
                    tl.to(dropzoneRef.current, { borderColor: "#00E68A", backgroundColor: "rgba(0, 230, 138, 0.05)", duration: 0.3 });
                    
                    tl.to(cursorRef.current, { x: 250, y: 50, duration: 1, ease: "power2.inOut" });
                    
                }, containerRef);

                return () => ctx.revert();
            }, []);

            return (
                <div ref={containerRef} className="bg-navy/30 rounded-3xl p-8 h-96 border border-chalk/10 relative overflow-hidden flex flex-col">
                    <h3 className="font-sora font-bold text-xl mb-4">Integra tu Normativa</h3>
                    <div className="flex-1 relative mt-4">
                        
                        <div ref={dropzoneRef} className="absolute right-4 top-4 w-48 h-32 border-2 border-dashed border-chalk/20 rounded-2xl flex flex-col justify-center items-center transition-colors">
                            {!uploaded ? (
                                <React.Fragment>
                                    <IconUpload className="mb-2 text-chalk/40" size={24} />
                                    <span className="text-xs text-chalk/40 font-mono">Carga tu archivo</span>
                                </React.Fragment>
                            ) : (
                                <div className="text-sgreen flex flex-col items-center">
                                    <IconCheck className="mb-2" size={24} />
                                    <span className="text-xs font-mono">Normativa interna.pdf</span>
                                </div>
                            )}
                        </div>

                        <div ref={fileRef} className="absolute z-10 w-40 bg-bone text-ink p-3 rounded-xl flex items-center gap-3 border border-chalk shadow-sm">
                            <div className="bg-ink/10 p-2 rounded-lg">
                                <IconFileText size={16} />
                            </div>
                            <span className="text-xs font-mono font-bold truncate">Normativa interna.pdf</span>
                        </div>

                        <div ref={cursorRef} className="absolute z-20 w-6 h-6">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M5.5 3.21V20.8C5.5 21.46 6.3 21.79 6.77 21.32L11.5 16.5H18.5C19.05 16.5 19.5 16.05 19.5 15.5V14.5C19.5 14.23 19.39 13.98 19.21 13.79L6.91 1.49C6.44 1.02 5.5 1.36 5.5 2.02V3.21Z" fill="white" stroke="black" strokeWidth="1.5"/>
                            </svg>
                        </div>
                    </div>
                </div>
            );
        };

        const HeadcountCard = () => {
            const containerRef = useRef(null);
            
            useLayoutEffect(() => {
                let ctx = gsap.context(() => {
                    // Left Animation: 1-to-1 linear loop
                    const leftTl = gsap.timeline({ repeat: -1 });
                    leftTl.fromTo(".ht-left-client", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "none" })
                          .fromTo(".ht-left-line", { scaleY: 0 }, { scaleY: 1, duration: 1, ease: "none", transformOrigin: "bottom center" })
                          .to([".ht-left-client", ".ht-left-line"], { opacity: 0, y: -20, duration: 0.5, delay: 1, ease: "none" })
                          .set([".ht-left-client", ".ht-left-line"], { y: 0, opacity: 1, clearProps: "y" });

                    // Right Animation: Snappy stagger multiple clients
                    const rightTl = gsap.timeline({ repeat: -1, repeatDelay: 1.5 });
                    rightTl.fromTo(".ht-right-line", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.4, stagger: 0.1, ease: "power2.out" })
                           .fromTo(".ht-right-client", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, stagger: 0.1, ease: "back.out(1.7)" }, "-=0.2")
                           .to([".ht-right-line", ".ht-right-client"], { opacity: 0, scale: 0.8, duration: 0.3, stagger: 0.05, ease: "power2.in" }, "+=1");

                }, containerRef);
                return () => ctx.revert();
            }, []);

            return (
                <div ref={containerRef} className="bg-ink rounded-3xl p-8 h-96 border border-chalk/10 relative flex flex-col shadow-lg">
                    <h3 className="font-sora font-bold text-xl mb-6 text-left text-bone">Mismo Equipo + Capacidad</h3>
                    
                    <div className="flex-1 flex gap-4 mt-2">
                        {/* Sin Dectia */}
                        <div className="flex-1 bg-obsidian/50 rounded-2xl border border-chalk/5 p-4 flex flex-col items-center shadow-inner">
                            <span className="text-xs font-mono text-chalk/40 mb-2">Sin Dectia</span>
                            <div className="flex-1 w-full flex flex-col items-center justify-between relative mt-2">
                                <div className="ht-left-client text-chalk/60 bg-navy/50 p-3 rounded-full border border-chalk/10 z-10 shadow-md"><IconUser size={24} /></div>
                                <div className="ht-left-line w-px h-16 bg-gradient-to-t from-chalk/20 to-chalk/5 border-l border-dashed border-chalk/20 absolute top-[40px] origin-bottom -z-0"></div>
                                <div className="ht-left-consultant text-chalk/80 bg-obsidian p-3 rounded-full border border-chalk/10 z-10"><IconUser size={24} /></div>
                            </div>
                        </div>

                        {/* Con Dectia */}
                        <div className="flex-1 bg-sgreen/5 rounded-2xl border border-sgreen/20 p-4 flex flex-col items-center shadow-sm">
                            <span className="text-xs font-mono text-sgreen/80 mb-2 font-bold">Con Dectia</span>
                            <div className="flex-1 w-full flex flex-col items-center justify-between relative mt-2">
                                <div className="w-full flex justify-between px-1 z-10 gap-1">
                                    <div className="ht-right-client text-bone bg-navy p-2 rounded-full border border-sgreen/30 shadow-md"><IconUser size={18} /></div>
                                    <div className="ht-right-client text-bone bg-navy p-2 rounded-full border border-sgreen/30 shadow-md mt-[-8px]"><IconUser size={18} /></div>
                                    <div className="ht-right-client text-bone bg-navy p-2 rounded-full border border-sgreen/30 shadow-md"><IconUser size={18} /></div>
                                </div>
                                
                                <svg className="absolute top-8 w-full h-[60px] -z-0" viewBox="0 0 100 60" preserveAspectRatio="none">
                                    <path className="ht-right-line stroke-sgreen/40" fill="none" strokeWidth="2" strokeDasharray="4 2" d="M50 60 L15 10" style={{transformOrigin: '50% 100%'}}/>
                                    <path className="ht-right-line stroke-sgreen/40" fill="none" strokeWidth="3" d="M50 60 L50 4" style={{transformOrigin: '50% 100%'}}/>
                                    <path className="ht-right-line stroke-sgreen/40" fill="none" strokeWidth="2" strokeDasharray="4 2" d="M50 60 L85 10" style={{transformOrigin: '50% 100%'}}/>
                                </svg>
                                
                                <div className="text-sgreen flex items-center gap-2 z-10 bg-sgreen/10 p-2 px-3 rounded-full border border-sgreen">
                                    <IconUser size={20} />
                                    <IconLaptop size={16} />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const DashboardCard = () => {
             const dashRef = useRef(null);

             useEffect(() => {
                 let ctx = gsap.context(() => {
                     // Animate Gauge
                     gsap.fromTo(".gauge-fill", 
                         { rotation: -90 }, 
                         { rotation: 45, duration: 2, ease: "power4.out", delay: 0.5, transformOrigin: "bottom center" }
                     );

                     // Animate Bars
                     gsap.fromTo(".bar-fill", 
                        { scaleY: 0 },
                        { scaleY: 1, duration: 1, stagger: 0.1, ease: "power2.out", delay: 1, transformOrigin: "bottom center" }
                     );

                     // Auto Scroll the dashboard content
                     gsap.to(".dash-content", {
                         yPercent: -40,
                         ease: "none",
                         duration: 8,
                         repeat: -1,
                         yoyo: true,
                         delay: 2
                     });

                 }, dashRef);
                 return () => ctx.revert();
             }, []);

            return (
                <div ref={dashRef} className="col-span-1 md:col-span-2 bg-obsidian border border-chalk/10 rounded-3xl h-96 flex overflow-hidden flex-col md:flex-row">
                    <div className="w-full md:w-1/2 p-12 flex flex-col justify-center border-b md:border-b-0 md:border-r border-chalk/10 z-10 bg-gradient-to-r from-obsidian to-transparent">
                        <h3 className="font-sora font-bold text-4xl mb-4 leading-tight">Informe completo<br/><span className="text-sgreen font-cormorant italic">en minutos.</span></h3>
                        <p className="font-outfit text-chalk/60">Data estructurada, KPIs accionables y matrices de riesgo generadas instantáneamente.</p>
                    </div>
                    <div className="w-full md:w-1/2 relative bg-navy/20 overflow-hidden pt-12 px-8 mask-image-bottom">
                        <div className="dash-content w-full absolute top-12 left-0 px-8 flex flex-col gap-6">
                            
                            <div className="bg-ink p-6 rounded-2xl border border-chalk/5">
                                <h4 className="text-xs font-mono text-chalk/40 mb-4">Índice de Riesgo</h4>
                                <div className="relative w-40 h-20 mx-auto overflow-hidden">
                                     <div className="absolute w-40 h-40 border-[16px] border-chalk/10 rounded-full"></div>
                                     <div className="gauge-fill absolute w-40 h-40 border-[16px] border-transparent border-t-sgreen border-r-sgreen rounded-full origin-center"></div>
                                </div>
                                <div className="text-center mt-[-10px] font-sora font-bold text-2xl">82<span className="text-xs text-sgreen ml-1">Estable</span></div>
                            </div>

                            <div className="bg-ink p-6 rounded-2xl border border-chalk/5 mb-20">
                                <h4 className="text-xs font-mono text-chalk/40 mb-6">Hallazgos por Zona</h4>
                                <div className="flex justify-between items-end h-32 px-4">
                                    {[60, 80, 40, 90, 50, 70].map((h, i) => (
                                        <div key={i} className="w-6 bg-chalk/10 rounded-t-sm relative h-full flex items-end">
                                            <div className="bar-fill w-full bg-sgreen rounded-t-sm" style={{ height: `${h}%` }}></div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };
        
        const Process = () => {
            const processRef = useRef(null);
            
            useLayoutEffect(() => {
                let ctx = gsap.context(() => {
                    gsap.to(".process-bg", {
                        yPercent: 30,
                        ease: "none",
                        scrollTrigger: {
                            trigger: processRef.current,
                            start: "top bottom",
                            end: "bottom top",
                            scrub: true
                        }
                    });
                }, processRef);
                return () => ctx.revert();
            }, []);

            return (
                <section id="paso" ref={processRef} className="relative py-32 px-8 md:px-24 overflow-hidden bg-bone text-ink">
                    <div className="absolute inset-0 z-0 overflow-hidden">
                        <img 
                            src="https://images.unsplash.com/39/lIZrwvbeRuuzqOoWJUEn_Photoaday_CSD.jpg" 
                            alt="Organic Texture" 
                            className="process-bg w-full h-[150%] object-cover opacity-20 contrast-150 grayscale"
                            onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d'; }}
                        />
                    </div>
                    <div className="relative z-10 max-w-7xl mx-auto">
                        <h2 className="font-sora text-5xl font-bold mb-16 text-center">El siguiente nivel <span className="text-sgreen font-cormorant italic font-normal">en seguridad.</span></h2>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                                        {[
                                { 
                                    title: "Diseña la evaluación", 
                                    content: (
                                        <>
                                            Selecciona entre <strong>Auditorías</strong> y <strong>Relevamientos</strong>, especifica tu tipo de instalaciones y configura los campos que necesites mientras la IA experta te asiste con la normativa internacional actualizada
                                        </>
                                    ) 
                                },
                                { 
                                    title: "Lanza el análisis", 
                                    content: "Define número de objetivos, organiza tu equipo asignando operados y publica. Tu equipo, cliente o potencial asociado completa el formulario desde cualquier lugar o dispositivo." 
                                },
                                { 
                                    title: "Evaluación automática", 
                                    content: "Cada respuesta genera un One-Pager con score de riesgo, hallazgos críticos y acciones inmediátas. Valor desde el primer momento." 
                                },
                                { 
                                    title: "Informe ejecutivo", 
                                    content: "Un clic. KPIs, vulnerabilidades, estrategias de mitigación y conclusiones accionables en base al estudio completo. Relevamientos detallados y auditorías expeditivas, listas para ser discutidas en profundidad." 
                                }
                            ].map((step, i) => (
                                <div key={i} className="bg-white/80 backdrop-blur-sm border border-navy/10 p-8 rounded-3xl shadow-sm hover:shadow-md transition-shadow">
                                    <h3 className="font-sora font-bold text-xl mb-4 text-navy"><span className="text-sgreen">{i+1}.</span> {step.title}</h3>
                                    <p className="font-outfit text-ink/70 text-sm leading-relaxed font-light">{step.content}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Coverage = () => {
            const containerRef = useRef(null);
            const cardsRef = useRef([]);

            useLayoutEffect(() => {
                let ctx = gsap.context(() => {
                    const cards = cardsRef.current;
                    cards.forEach((card, i) => {
                        if (i === 0) return;
                        
                        ScrollTrigger.create({
                            trigger: card,
                            start: "top 60%",
                            end: "top 20%",
                            scrub: true,
                            animation: gsap.fromTo(cards[i - 1],
                                { scale: 1, filter: "blur(0px)", opacity: 1 },
                                { scale: 0.95, filter: "blur(0px)", opacity: 0.8, ease: "power2.inOut" }
                            )
                        });
                    });
                }, containerRef);
                return () => ctx.revert();
            }, []);

            const cases = [
                { 
                    title: "Data Center", 
                    icon: <GearArtifact />,
                    tags: ["IA-942-B (2017)", "ISO/IEC 27001:2022 A.7", "ASIS PSC.1-2012", "NFPA 75", "EN 50600"]
                },
                { 
                    title: "Residencia Horizontal", 
                    icon: <BuildingArtifact />,
                    tags: ["ASIS International - Security Management Standard (2018)", "ISO 31000:2018", "NTC 5681", "CPTED Guidelines"]
                },
                { 
                    title: "Institución Educativa", 
                    icon: <EduArtifact />,
                    tags: ["ASIS K-12 School Security Guidelines (2020)", "CISA K-12 School Security Guide", "NFPA 101", "ISO 31000:2018", "I Love U Guys SRP"]
                },
                { 
                    title: "Planta Industrial", 
                    icon: <IndustrialArtifact />,
                    tags: ["ASIS PSC.1-2012", "ISO 28000:2022 (Supply Chain Security)", "C-TPAT Security Criteria", "OHSAS 45001:2018", "NFPA 101"]
                },
                { 
                    title: "Centro Comercial Retail", 
                    icon: <RetailArtifact />,
                    tags: ["ASIS Loss Prevention 2020", "ISO 31000:2018", "Loss Prevention Foundation (LPQ/LPC)", "NFPA 101", "EAS Best Practices"]
                },
                { 
                    title: "Locales Cobranza", 
                    icon: <MoneyArtifact />,
                    tags: ["ASIS Loss Prevention (2020)", "ISO 31000:2018", "UL 687 / EN 1143-1 (Cajas Fuertes)", "IRAM 3597", "NFPA 101", "UNE-EN 50131", "BCRA / FEHGRA"]
                }
            ];

            return (
                <section id="cobertura" ref={containerRef} className="py-32 px-8 md:px-24 bg-obsidian relative min-h-[300vh]">
                    <div className="max-w-4xl mx-auto h-full">
                        <h2 className="font-sora text-5xl font-bold mb-32 text-center text-bone">Cobertura <span className="font-cormorant italic text-sgreen font-normal">integral.</span></h2>
                        
                        <div className="flex flex-col gap-[30vh] relative pb-[30vh]">
                            {cases.map((c, i) => (
                                <div 
                                    key={i} 
                                    ref={el => cardsRef.current[i] = el}
                                    className="bg-navy/40 border border-chalk/10 rounded-[3rem] p-12 min-h-[50vh] flex flex-col items-center justify-center sticky backdrop-blur-xl shadow-2xl origin-top" style={{ top: `calc(8rem + ${i * 1.5}rem)` }}
                                >
                                    <div className="mb-12">
                                        {c.icon}
                                    </div>
                                    <h3 className="font-sora font-bold text-4xl text-bone text-center mb-8">{c.title}</h3>
                                    <div className="flex flex-wrap justify-center gap-2 max-w-2xl px-4">
                                        {c.tags?.map((tag, idx) => (
                                            <span key={idx} className="bg-obsidian/60 border border-sgreen/30 text-sgreen/90 text-[10px] sm:text-xs px-4 py-1.5 rounded-full font-mono shadow-sm">
                                                {tag}
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => {
            const [isFormOpen, setIsFormOpen] = useState(false);

            useEffect(() => {
                const script = document.createElement('script');
                script.src = 'https://assets.calendly.com/assets/external/widget.js';
                script.async = true;
                document.body.appendChild(script);
            }, []);

            return (
                <footer id="agenda-demo" className="bg-obsidian pt-16 px-8 md:px-24 border-t border-navy/30">
                    <div 
                        className="max-w-7xl mx-auto bg-navy/20 rounded-t-[4rem] p-16 border border-b-0 border-chalk/5 mb-0 mt-8 text-center group cursor-pointer hover:bg-navy/40 transition-colors"
                        onClick={() => setIsFormOpen(!isFormOpen)}
                    >
                        <h2 className="font-sora font-bold text-5xl md:text-7xl mb-12 group-hover:text-sgreen transition-colors leading-tight">Agenda una <span className="font-cormorant italic font-normal">demo.</span></h2>
                        <button className="btn-magnetic bg-bone text-ink font-bold px-12 py-5 rounded-full text-lg shadow-xl inline-flex items-center gap-3">
                            {isFormOpen ? 'Cerrar Formulario' : 'Solicitar Acceso'}
                            <div className={"w-2 h-2 rounded-full bg-sgreen " + (isFormOpen ? "" : "animate-pulse")}></div>
                        </button>
                        
                        <div 
                            className="overflow-hidden transition-all duration-700 ease-in-out" 
                            style={{ 
                                maxHeight: isFormOpen ? '900px' : '0px', 
                                opacity: isFormOpen ? 1 : 0,
                                marginTop: isFormOpen ? '3rem' : '0px'
                            }}
                            onClick={(e) => e.stopPropagation()}
                        >
                            <div className="bg-white rounded-3xl p-2 overflow-hidden shadow-2xl max-w-4xl mx-auto border border-chalk/10" style={{ height: '780px' }}>
                                <div 
                                    className="calendly-inline-widget" 
                                    data-url="https://calendly.com/montillajafet/reunion-valorant" 
                                    style={{ 
                                        minWidth: '320px', 
                                        height: '850px', 
                                        transform: 'scale(0.9)', 
                                        transformOrigin: 'top center',
                                        marginTop: '-5px'
                                    }}
                                ></div>
                            </div>
                        </div>
                    </div>
                </footer>
            );
        };

        const GearArtifact = () => (
            <div className="w-32 h-32 relative flex items-center justify-center border-4 border-dashed border-sgreen/30 rounded-full animate-[spin_10s_linear_infinite]">
                <div className="w-16 h-16 bg-sgreen/20 rounded-full flex items-center justify-center border border-sgreen">
                    <div className="w-6 h-6 bg-sgreen rounded-full animate-pulse"></div>
                </div>
            </div>
        );
        
        const BuildingArtifact = () => (
            <div className="w-32 h-32 relative overflow-hidden border border-chalk/20 bg-ink rounded-lg flex items-end justify-center p-4">
                <div className="w-full h-2 bg-sgreen/50 absolute top-0 animate-[ping_3s_infinite]"></div>
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#00E68A" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            </div>
        );

        const EduArtifact = () => (
            <div className="w-40 h-16 flex items-center justify-between border-b-2 border-chalk/20 relative mt-8">
                <div className="h-4 w-4 rounded-full bg-sgreen shadow-[0_0_15px_#00E68A] absolute left-0 animate-ping"></div>
                <div className="h-4 w-4 rounded-full bg-sgreen shadow-[0_0_15px_#00E68A] absolute left-1/2 -translate-x-1/2 animate-ping delay-100"></div>
                <div className="h-4 w-4 rounded-full bg-sgreen shadow-[0_0_15px_#00E68A] absolute right-0 animate-ping delay-200"></div>
            </div>
        );

        const IndustrialArtifact = () => (
            <div className="w-32 h-32 grid grid-cols-3 gap-2 p-2 border border-chalk/20 bg-ink rounded-xl">
                {[...Array(9)].map((_, i) => (
                    <div key={i} className="bg-sgreen/20 rounded-sm relative overflow-hidden">
                        <div className="absolute inset-0 bg-sgreen opacity-0" style={{ animation: `ping 2s infinite ${i * 0.2}s` }}></div>
                    </div>
                ))}
            </div>
        );
        
        const RetailArtifact = () => (
            <div className="w-48 h-20 rounded-full border border-chalk/20 relative flex items-center px-4 overflow-hidden">
                <div className="absolute h-full w-4 bg-sgreen left-0 blur-md" style={{ animation: 'slideRight 3s infinite linear' }}></div>
                <style>{`
                    @keyframes slideRight {
                        0% { left: 0%; opacity: 0;}
                        10% { opacity: 1;}
                        90% { opacity: 1;}
                        100% { left: 100%; opacity: 0; }
                    }
                `}</style>
                <div className="w-full flex justify-between font-mono text-xs text-chalk/40 z-10">
                    <span>IN</span>
                    <span>OUT</span>
                </div>
            </div>
        );

        const MoneyArtifact = () => (
            <div className="w-32 h-32 border border-chalk/20 rounded-2xl flex items-center justify-center p-4">
                <svg className="w-16 h-16 text-sgreen animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
