        );
        const IconUser = ({ size = 24, className = "" }) => (
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        );

        );

        const App = () => {
            useEffect(() => {
                const focusHashTarget = () => {
                    const hash = window.location.hash;
                    if (!hash) return;
                    const target = document.querySelector(hash);
                    if (target && typeof target.focus === 'function') {
                        target.focus({ preventScroll: true });
                    }
                };

                focusHashTarget();
                window.addEventListener('hashchange', focusHashTarget);
                return () => window.removeEventListener('hashchange', focusHashTarget);
            }, []);

            return (
                <div className="bg-obsidian w-full min-h-screen relative font-outfit text-chalk">
                    <SkipNav />
                    <Navbar />
                    <main id="main-content" tabIndex={-1} className="section-anchor outline-none">
                        <Hero />
                        <Features />
                        <Process />
                        <Coverage />
                    </main>
                    <Footer />
                </div>
            );
        };

        const SkipNav = () => (

                <a href="#features" className="skip-link">Saltar a Plataforma</a>
                <a href="#paso" className="skip-link">Saltar a Metodología</a>
                <a href="#cobertura" className="skip-link">Saltar a Casos de Uso</a>
                <a href="#agenda-demo" className="skip-link">Saltar a Agendar demo</a>
            </nav>
        );

        const Navbar = () => {
            const navRef = useRef(null);
            const containerRef = useRef(null);
            const [menuOpen, setMenuOpen] = useState(false);
            const mobileMenuId = "mobile-nav-menu";

            useLayoutEffect(() => {
                let ctx = gsap.context(() => {
                    ScrollTrigger.create({
                        start: 'top -50',
                        end: 99999,
                        toggleClass: {
                            targets: containerRef.current,
                            className: 'nav-scrolled'
                        }
                    });
                });
                return () => ctx.revert();
            }, []);

            useEffect(() => {
                const handleEscape = (event) => {
                    if (event.key === 'Escape') setMenuOpen(false);
                };
                document.addEventListener('keydown', handleEscape);
                return () => document.removeEventListener('keydown', handleEscape);
            }, []);

            const closeMenu = () => setMenuOpen(false);

            return (
                <nav className="fixed top-6 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-5xl transition-all duration-500 group" ref={containerRef} aria-label="Navegación principal">
                    <div ref={navRef} className="flex items-center justify-between px-8 py-4 rounded-full border border-transparent transition-all duration-500 bg-transparent text-white group-[.nav-scrolled]:bg-white group-[.nav-scrolled]:border-sgreen/30 group-[.nav-scrolled]:text-ink shadow-lg">
                        <a href="/" aria-label="Dectia — Inicio" className="relative flex-shrink-0 h-6 md:h-7">
                            <img
                                src="./logo-light.svg"
                                alt=""
                                width="167"
                                height="38"
                                className="h-full w-auto block group-[.nav-scrolled]:hidden transition-opacity duration-500"
                            />
                            <img
                                src="./logo-dark.svg"
                                alt=""
                                width="167"
                                height="38"
                                className="h-full w-auto hidden group-[.nav-scrolled]:block transition-opacity duration-500"
                            />
                        </a>
                        <div className="hidden md:flex gap-8 text-sm font-medium">
                            <a href="#features" className="hover:text-sgreen transition-colors rounded-sm">Plataforma</a>
                            <a href="#paso" className="hover:text-sgreen transition-colors rounded-sm">Metodología</a>
                            <a href="#cobertura" className="hover:text-sgreen transition-colors rounded-sm">Casos de Uso</a>
                        </div>
                        <div className="flex items-center gap-3 md:gap-6">
                            <button
                                type="button"
                                className="md:hidden p-2 rounded-full hover:bg-white/10 group-[.nav-scrolled]:hover:bg-ink/5 transition-colors"
                                aria-expanded={menuOpen}
                                aria-controls={mobileMenuId}
                                aria-label={menuOpen ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'}
                                onClick={() => setMenuOpen((open) => !open)}
                            >
                                <svg aria-hidden="true" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                                    {menuOpen
                                        ? <><line x1="6" y1="6" x2="18" y2="18" /><line x1="6" y1="18" x2="18" y2="6" /></>
                                        : <><line x1="4" y1="7" x2="20" y2="7" /><line x1="4" y1="12" x2="20" y2="12" /><line x1="4" y1="17" x2="20" y2="17" /></>}
                                </svg>
                            </button>
                            <a href="#agenda-demo" className="btn-magnetic bg-sgreen text-navy font-bold px-4 md:px-6 py-2 rounded-full text-sm flex items-center justify-center">
                                Agendar Demo
                            </a>
                            <a href="https://app.dectia-ai.com" target="_blank" rel="noopener noreferrer" aria-label="Acceder a la plataforma (se abre en una nueva pestaña)" className="hidden sm:flex btn-magnetic bg-white text-navy font-bold px-6 py-2 rounded-full text-sm hover:opacity-90 transition-opacity">Acceder</a>
                        </div>
                    </div>
                    {menuOpen && (
                        <div
                            id={mobileMenuId}
                            className="md:hidden mt-2 rounded-3xl border border-sgreen/30 bg-white text-ink shadow-lg p-4"
                        >
                            <ul className="flex flex-col gap-2">
                                <li><a href="#features" className="block px-4 py-3 rounded-2xl hover:bg-bone transition-colors" onClick={closeMenu}>Plataforma</a></li>
                                <li><a href="#paso" className="block px-4 py-3 rounded-2xl hover:bg-bone transition-colors" onClick={closeMenu}>Metodología</a></li>
                                <li><a href="#cobertura" className="block px-4 py-3 rounded-2xl hover:bg-bone transition-colors" onClick={closeMenu}>Casos de Uso</a></li>
                                <li className="sm:hidden"><a href="https://app.dectia-ai.com" target="_blank" rel="noopener noreferrer" className="block px-4 py-3 rounded-2xl hover:bg-bone transition-colors" onClick={closeMenu}>Acceder</a></li>
                            </ul>
                        </div>
                    )}
                </nav>
            );
        };

        const Hero = () => {
            const heroRef = useRef(null);
            
            useLayoutEffect(() => {
                let ctx = gsap.context(() => {
                    gsap.from(".hero-text", {
                        y: 50,
                        opacity: 0,
                        duration: 1.2,
                        stagger: 0.2,
                        ease: "power4.out",
                        delay: 0.2
                    });
                }, heroRef);
                return () => ctx.revert();
            }, []);

            return (
                <section ref={heroRef} aria-labelledby="hero-heading" className="relative isolate w-full min-h-[100dvh] h-[100dvh] overflow-hidden">
                    <div className="absolute inset-0" aria-hidden="true">
                        <img 
                            src="./hero-bg.png" 
                            alt="" 
                            width="1920"
                            height="1080"
                            fetchpriority="high"
                            decoding="async"
                            className="absolute inset-0 h-full w-full object-cover object-center grayscale-[30%] blur-[1px] scale-105"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-obsidian via-obsidian/80 to-navy/30 mix-blend-multiply"></div>
                        <div className="absolute inset-0 bg-gradient-to-br from-obsidian via-transparent to-transparent"></div>
                    </div>

                                Convierte auditorías y relevamientos de seguridad en procesos rápidos, trazables y asistidos por IA. Del campo al informe en el mismo día.

                            <div className="hero-text flex gap-4">

        const ComplianceCard = () => {
            const [cards, setCards] = useState(["Normativa Interna", "ISO 27001", "NFPA 730"]);
            
            useEffect(() => {
                const interval = setInterval(() => {
                    setCards(prev => {
                        const newCards = [...prev];
                        const last = newCards.pop();
                        newCards.unshift(last);
                        return newCards;
                    });
                }, 3000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="bg-navy/30 border border-chalk/10 rounded-3xl p-10 h-96 flex flex-col items-center justify-center relative overflow-hidden">
                    <h3 className="absolute top-8 left-8 font-sora font-bold text-xl">Estándares siempre vigentes</h3>
                    <div className="relative w-full max-w-xs h-48 mt-12">
                        {cards.map((text, i) => (

                                maxHeight: isFormOpen ? '900px' : '0px', 
                                opacity: isFormOpen ? 1 : 0,
                                marginTop: isFormOpen ? '3rem' : '0px'
                            }}
                        >
                            <div className="rounded-3xl overflow-hidden w-full mx-auto" style={{ height: '780px' }}>
                                <div 
                                    className="calendly-inline-widget" 
                                    data-url="https://calendly.com/montillajafet/reunion-valorant?background_color=ffffff00&text_color=e8e8e3&primary_color=00e68a&hide_gdpr_banner=1" 
                                    title="Formulario para agendar una demo con Dectia"
                                    style={{ 
                                        minWidth: '320px',
                                        width: '100%',
                                        height: '850px', 
                                        transform: 'scale(0.9)', 
                                        transformOrigin: 'top center',
                                        marginTop: '-5px'
                                    }}
                                ></div>
                            </div>
                        </div>
                    </section>
                    <div className="max-w-7xl mx-auto py-6 flex flex-col md:flex-row items-center justify-between gap-2 border-t border-navy/20 mt-0">
                        <div className="flex flex-col items-start gap-2">
                            <span className="font-sora font-bold text-chalk/60 text-sm tracking-tight">Dectia.</span>
                            <span className="font-mono text-xs text-chalk/20 flex items-center gap-1.5">
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" className="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 22V12h6v10"/><path d="M3 9h18"/><path d="M9 3v6"/><path d="M15 3v6"/></svg>
                                Ciudad Autónoma de Buenos Aires, Argentina
                            </span>
                            </div>
                        <span className="font-mono text-xs text-chalk/30">&copy; {new Date().getFullYear()} Dectia. Todos los derechos reservados.</span>
                    </div>
                </footer>
            );
        };

        const GearArtifact = () => (
            <div className="w-32 h-32 relative flex items-center justify-center border-4 border-dashed border-sgreen/30 rounded-full animate-[spin_10s_linear_infinite]">
                <div className="w-16 h-16 bg-sgreen/20 rounded-full flex items-center justify-center border border-sgreen">
                    <div className="w-6 h-6 bg-sgreen rounded-full animate-pulse"></div>
                </div>
            </div>
        );
        
        const BuildingArtifact = () => (
            <div className="w-32 h-32 relative overflow-hidden border border-chalk/20 bg-ink rounded-lg flex items-end justify-center p-4">
                <div className="w-full h-2 bg-sgreen/50 absolute top-0 animate-[ping_3s_infinite]"></div>
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#00E68A" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            </div>
        );

        const EduArtifact = () => (
            <div className="w-40 h-16 flex items-center justify-between border-b-2 border-chalk/20 relative mt-8">
                <div className="h-4 w-4 rounded-full bg-sgreen shadow-[0_0_15px_#00E68A] absolute left-0 animate-ping"></div>
                <div className="h-4 w-4 rounded-full bg-sgreen shadow-[0_0_15px_#00E68A] absolute left-1/2 -translate-x-1/2 animate-ping delay-100"></div>
                <div className="h-4 w-4 rounded-full bg-sgreen shadow-[0_0_15px_#00E68A] absolute right-0 animate-ping delay-200"></div>
            </div>
        );

        const IndustrialArtifact = () => (
            <div className="w-32 h-32 grid grid-cols-3 gap-2 p-2 border border-chalk/20 bg-ink rounded-xl">
                {[...Array(9)].map((_, i) => (
                    <div key={i} className="bg-sgreen/20 rounded-sm relative overflow-hidden">
                        <div className="absolute inset-0 bg-sgreen opacity-0" style={{ animation: `ping 2s infinite ${i * 0.2}s` }}></div>
                    </div>
                ))}
            </div>
        );
        
        const RetailArtifact = () => (
            <div className="w-48 h-20 rounded-full border border-chalk/20 relative flex items-center px-4 overflow-hidden">
                <div className="absolute h-full w-4 bg-sgreen left-0 blur-md" style={{ animation: 'slideRight 3s infinite linear' }}></div>
                <style>{`
                    @keyframes slideRight {
                        0% { left: 0%; opacity: 0;}
                        10% { opacity: 1;}
                        90% { opacity: 1;}
                        100% { left: 100%; opacity: 0; }
                    }
                `}</style>
                <div className="w-full flex justify-between font-mono text-xs text-chalk/40 z-10">
                    <span>IN</span>
                    <span>OUT</span>
                </div>
            </div>
        );

        const MoneyArtifact = () => (
            <div className="w-32 h-32 border border-chalk/20 rounded-2xl flex items-center justify-center p-4">
                <svg className="w-16 h-16 text-sgreen animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
